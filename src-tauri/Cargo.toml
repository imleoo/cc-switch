[package]
name = "cc-switch"
version = "4.20.4"
description = "All-in-One Assistant for Claude Code, Codex & Gemini CLI"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

# we2ai: 显式声明 bin target，让 `cargo build`/`tauri dev` 直接产出 we2ai(.exe)，
# 而不是跟着 [package] name 走的 cc-switch(.exe)（见自定义开发功能列表.md 功能 5
# 的 "Linux deep-link 并存冲突"一节）。`tauri.conf.json` 的 mainBinaryName 只在
# `tauri build` 打包阶段重命名产物，`cargo build`/`pnpm tauri dev` 不经过那一步，
# macOS 钥匙串授权提示、登录项等系统级 UI 仍会显示 cargo 产出的原始进程名。
# 不改 [package] name：那会牵动 Cargo.toml/Cargo.lock 的包名条目、
# scripts/we2ai/lib.sh 的版本号定位（依赖 `name = "cc-switch"`）等一大片。
[[bin]]
name = "we2ai"
path = "src/main.rs"

[features]
default = []
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
# we2ai: 公告系统通知（固定 =2.4.0：MSRV 1.77，配合 Cargo.lock 中 notify-rust 4.11.7 可在 rustc 1.88 构建）
tauri-plugin-notification = "=2.4.0"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"
sys-locale = "0.3"
rand = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"] }
# we2ai: refresh_token 系统钥匙串存储（方案第 5.2 节）。v3 系列 MSRV 1.75，
# 与本 crate 声明的 rust-version = "1.85.0" 兼容；v4 系列（feature 名已改为
# `apple-native-keyring-store` 等）MSRV 1.88，高于本 crate 声明版本，暂不采用。
keyring = { version = "3.6", features = ["sync-secret-service"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
rquickjs = { version = "0.8", features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }
keyring = { version = "3.6", features = ["apple-native"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
# we2ai: 登录会话（api.rs/session.rs）的 HTTP 错误形态解码、失败分类、单飞
# refresh、登出等测试用真实 HTTP mock server 驱动 reqwest 客户端，而不是只测
# 纯函数。
wiremock = "0.6"
# we2ai: 仅测试期启用 tauri 的 mock 运行时（tauri::test），用于对
# we2ai::mode::gate() 做真实的 IPC 分发测试，而不只是测底层判定纯函数。
tauri = { version = "2.8.2", features = ["test"] }
